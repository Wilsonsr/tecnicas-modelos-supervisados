name: Publicar el sitio en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.24

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Deja constancia de con qué versiones se construyó este sitio.
      # Si un render falla en el futuro por un cambio de API, este paso dice
      # exactamente qué versión lo introdujo.
      - name: Registrar versiones
        run: |
          python -c "import sys; print('Python', sys.version)"
          pip list --format=columns | grep -Ei 'pandas|numpy|scikit-learn|matplotlib|seaborn|plotly|statsmodels'

      # Los .qmd son la fuente de verdad: los cuadernos Jupyter se regeneran
      # en cada publicación, de modo que no puedan quedar desfasados.
      - name: Generar los cuadernos Jupyter
        run: python codigo/generar_cuadernos.py

      - name: Renderizar el sitio
        run: quarto render

      # Si los cuadernos regenerados difieren de los versionados, se avisa.
      # No detiene la publicación: solo recuerda confirmar el cambio.
      - name: Comprobar que los cuadernos están al día
        run: |
          if ! git diff --quiet -- cuadernos/; then
            echo "::warning::Los cuadernos del repositorio no coinciden con los .qmd."
            echo "Ejecuta 'python codigo/generar_cuadernos.py' y confirma el resultado."
            git diff --stat -- cuadernos/
          else
            echo "Los cuadernos están sincronizados con los cuadernillos."
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
